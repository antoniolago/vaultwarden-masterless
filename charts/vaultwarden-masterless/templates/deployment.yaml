apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultwarden-masterless.fullname" . }}
  labels:
    {{- include "vaultwarden-masterless.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vaultwarden-masterless.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "vaultwarden-masterless.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "vaultwarden-masterless.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: masterless
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.port | int }}
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "vaultwarden-masterless.fullname" . }}-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rsa
              mountPath: /secrets/rsa
              readOnly: true
            {{- if not .Values.vaultwarden.enabled }}
            - name: vw-rsa
              mountPath: /secrets/vw-rsa
              readOnly: true
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vaultwarden-masterless.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: rsa
          secret:
            secretName: {{ include "vaultwarden-masterless.rsaSecretName" . }}
        {{- if not .Values.vaultwarden.enabled }}
        - name: vw-rsa
          secret:
            secretName: {{ include "vaultwarden-masterless.vwRsaSecretName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
