{{- if and .Values.vaultwarden.enabled (not .Values.keycloak.enabled) .Values.vaultwarden.orgSetup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vaultwarden-masterless.fullname" . }}-org-setup
  labels:
    {{- include "vaultwarden-masterless.labels" . | nindent 4 }}
    app.kubernetes.io/component: org-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: org-setup
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-vaultwarden
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Vaultwarden to be ready..."
              until wget -qO- http://{{ include "vaultwarden-masterless.fullname" . }}-vaultwarden:80/alive 2>/dev/null; do
                echo "Vaultwarden not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "Vaultwarden is ready!"
      containers:
        - name: setup
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              ADMIN_TOKEN="{{ .Values.vaultwarden.adminToken.value }}"
              {{- if .Values.vaultwarden.adminToken.existingSecret }}
              ADMIN_TOKEN="$(cat /secrets/admin-token)"
              {{- end }}

              ORG_NAME="{{ .Values.vaultwarden.orgSetup.name }}"
              ORG_ID="{{ .Values.vaultwarden.orgSetup.identifier }}"
              BILLING_EMAIL="{{ .Values.vaultwarden.orgSetup.billingEmail }}"
              VW_URL="http://{{ include "vaultwarden-masterless.fullname" . }}-vaultwarden:80"

              echo "Creating organization '${ORG_NAME}'..."
              curl -s -X POST "${VW_URL}/api/accounts/organizations" \
                -H "Content-Type: application/json" \
                -d "{\"Name\":\"${ORG_NAME}\",\"BillingEmail\":\"${BILLING_EMAIL}\"}"
              echo ""
              echo "Organization setup complete."
          {{- if .Values.vaultwarden.adminToken.existingSecret }}
          volumeMounts:
            - name: admin-secret
              mountPath: /secrets
              readOnly: true
          {{- end }}
      {{- if .Values.vaultwarden.adminToken.existingSecret }}
      volumes:
        - name: admin-secret
          secret:
            secretName: {{ .Values.vaultwarden.adminToken.existingSecret }}
            items:
              - key: {{ .Values.vaultwarden.adminToken.key | default "ADMIN_TOKEN" }}
                path: admin-token
      {{- end }}
{{- end }}
