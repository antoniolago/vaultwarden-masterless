{{- if not .Values.rsaKeys.existingSecret }}
{{- $secretName := include "vaultwarden-masterless.rsaSecretName" . }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- if .Values.rsaKeys.privateKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "vaultwarden-masterless.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  rsa_private.pem: |
    {{- .Values.rsaKeys.privateKey | nindent 4 }}
  rsa_public.pem: |
    {{- .Values.rsaKeys.publicKey | nindent 4 }}
{{- else if $existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "vaultwarden-masterless.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  rsa_private.pem: {{ index $existingSecret.data "rsa_private.pem" }}
  rsa_public.pem: {{ index $existingSecret.data "rsa_public.pem" }}
{{- end }}
{{- /* If neither user-provided nor existing, the keygen Job will create it */}}
{{- end }}
