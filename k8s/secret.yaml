# RSA keys for sealing/unsealing vault keys at rest
# Generate with: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096
# Replace the placeholder values below with real PEM-encoded keys.
apiVersion: v1
kind: Secret
metadata:
  name: vw-masterless-rsa
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vw-masterless
    app.kubernetes.io/component: masterless
type: Opaque
stringData:
  rsa_private.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_YOUR_4096_BIT_RSA_PRIVATE_KEY
    -----END PRIVATE KEY-----
  rsa_public.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_YOUR_RSA_PUBLIC_KEY
    -----END PUBLIC KEY-----

---
# Vaultwarden's RSA public key (for JWT verification)
# Copy from your Vaultwarden data volume: data/rsa_key.pub.pem
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-rsa-pubkey
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vw-masterless
    app.kubernetes.io/component: masterless
type: Opaque
stringData:
  rsa_key.pub.pem: |
    -----BEGIN RSA PUBLIC KEY-----
    REPLACE_WITH_VAULTWARDEN_RSA_PUBLIC_KEY
    -----END RSA PUBLIC KEY-----
