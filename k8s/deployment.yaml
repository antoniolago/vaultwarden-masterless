apiVersion: apps/v1
kind: Deployment
metadata:
  name: vw-masterless
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vw-masterless
    app.kubernetes.io/component: masterless
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vw-masterless
  strategy:
    type: Recreate          # SQLite doesn't support concurrent writers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vw-masterless
        app.kubernetes.io/component: masterless
    spec:
      containers:
        - name: masterless
          # Pin a released tag (`main` follows the default branch; `sha-<short>` pins a commit)
          image: ghcr.io/antoniolago/vaultwarden-masterless:main
          ports:
            - containerPort: 8484
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vw-masterless-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rsa
              mountPath: /secrets/rsa
              readOnly: true
            - name: vw-rsa
              mountPath: /secrets/vw-rsa
              readOnly: true
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vw-masterless-data
        - name: rsa
          secret:
            secretName: vw-masterless-rsa
        - name: vw-rsa
          secret:
            secretName: vaultwarden-rsa-pubkey
