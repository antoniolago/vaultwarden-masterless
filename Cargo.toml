[package]
name = "vaultwarden-masterless"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Masterpassword-less SSO proxy for Vaultwarden — stores user encryption keys and patches API responses"
repository = "https://github.com/antoniolago/vaultwarden-masterless"

[dependencies]
# Web framework
actix-web = { version = "4", features = ["rustls"] }
actix-rt = "2"
actix-tls = { version = "3", features = ["rustls"] }

# WebSocket proxying (SignalR /notifications/hub)
actix-ws = "0.3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["connect"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Cryptography
aes-gcm = "0.10"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

# JWT validation
jsonwebtoken = "9"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
tokio = { version = "1", features = ["full"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (for reverse proxy)
reqwest = { version = "0.12", features = ["json"] }

# URL parsing (for SSO state extraction)
url = "2"

# Rate limiting
actix-governor = "0.8"

# Unix file permissions
libc = "0.2"

# TLS/SSL (actix-web uses rustls 0.20)
rustls = "0.20"
rustls-pemfile = "1"

# Error handling
thiserror = "1"
anyhow = "1"

[dev-dependencies]
actix-test = "0.1"
tempfile = "3"
